name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install API, agent and model packages
        run: python -m pip install -e 'services/api[dev]' -e 'services/agents[dev]' -e 'services/model[dev]'
      - name: Run Python checks
        run: PYTHONPATH=services/api/src:services/agents/src:services/model/src python -m pytest services/api/tests services/agents/tests services/model/tests
      - name: Lint Python
        run: ruff check services/api services/agents services/model

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  field-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/field
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
      - run: flutter pub get
      - run: flutter analyze
