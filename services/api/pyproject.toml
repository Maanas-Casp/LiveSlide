[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "liveslide-api"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "SQLAlchemy>=2,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "bcrypt>=4.2,<6",
  "Pillow>=10,<13", "jsonschema>=4.23,<5", "httpx>=0.27,<1",
  "email-validator>=2,<3", "python-multipart>=0.0.9,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
[tool.hatch.build.targets.wheel]
packages = ["src/liveslide_api"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
