[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "liveslide-model"
version = "0.1.0"
description = "Reproducible data and evaluation pipeline for Liveslide"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<22",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "statsmodels>=0.14,<1",
  "lightgbm>=4.5,<5",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
geo = ["geopandas>=1.0,<2", "rasterio>=1.4,<2", "xarray>=2024.6", "h5netcdf>=1.3"]
nasa = ["earthaccess>=0.9,<1"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/liveslide_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
